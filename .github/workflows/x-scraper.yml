name: X Scraper

on:
  schedule:
    # Every 4 hours
    - cron: '0 */4 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Call K(now) AI webhook
        run: |
          curl -s -X POST "${{ secrets.KNOWAI_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.KNOWAI_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"source": "gh-actions-cron"}'
